<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina de robots</title>
<style>
:root{--bg:#12161a;--card:#1b2127;--tx:#e8ecef;--mut:#8b979f;--bd:#2c353d;--ac:#7bd88f;--bad:#f0806b;--warn:#e8c15a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{font-size:1.05rem;margin:0;margin-right:auto}
#estado{font-size:.82rem;padding:3px 10px;border-radius:99px;background:#3a3320;color:var(--warn)}
#estado.real{background:#1f3a29;color:var(--ac)}
button,input{font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 12px}
button{cursor:pointer;background:#25422f;border-color:#2f5a3d}
button.s{background:var(--bg)}
.wrap{display:grid;grid-template-columns:1fr 400px;gap:0;min-height:calc(100vh - 58px)}
#lienzo{width:100%;display:block;touch-action:manipulation}
.cv{padding:8px;min-width:0}
aside{border-left:1px solid var(--bd);padding:16px;background:var(--card);overflow:auto;position:sticky;top:0;align-self:start;max-height:100vh}
aside h2{margin:0 0 4px;font-size:1.1rem}
.k{color:var(--mut);font-size:.82rem;margin-top:10px}
.v{font-size:1.25rem;font-weight:600}
.pos{color:var(--ac)}.neg{color:var(--bad)}
pre{white-space:pre-wrap;word-break:break-word;font-size:.78rem;color:var(--mut);background:var(--bg);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
#clave{display:none;gap:8px;align-items:center}
.b3{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.b3 h2{margin:0 0 8px;font-size:1rem}.b3 h2 span{color:var(--mut);font-weight:400;font-size:.85rem}
.b3 .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.b3 .c{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.b3 .c .k{margin:0}.b3 .c .v{font-size:1.15rem}
.b3 canvas{width:100%;height:130px;display:block;margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
aside canvas{width:100%;height:150px;display:block;margin-top:8px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.estr{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-top:8px}
.tw{overflow-x:auto;margin-top:6px}table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500}
th:first-child,td:first-child{text-align:left}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}.mc .k{margin:0;font-size:.74rem}.mc .w{font-size:1.05rem;font-weight:600}
.les{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.82rem}.les span:last-child{text-align:right;white-space:nowrap}
.inf{background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.82rem;line-height:1.4}.inf.alerta{border-left:3px solid #e8a33a}
.sub{margin:14px 0 4px;font-weight:600;font-size:.9rem}.nota{color:var(--mut);font-size:.78rem;margin-top:6px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--bd);position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>🏢 Oficina de robots</h1>
  <span id="estado">DEMO · datos inventados</span>
  <span id="clave"><input id="pw" type="password" placeholder="Clave del panel" autocomplete="off"><button id="ok">Conectar</button></span>
  <button class="s" id="btnReal">Ver datos reales</button>
  <button class="s" id="btnDemo" style="display:none">Volver a demo</button>
</header>
<section class="b3" id="b3"></section>
<div class="wrap">
  <div class="cv"><canvas id="lienzo"></canvas></div>
  <aside id="panel"><h2>Tocá un escritorio</h2><p class="k">Cada escritorio es un robot. La cara cambia con su resultado y la pantalla muestra su valor en el tiempo. Las otras salas son los demás roles del sistema.</p></aside>
</div>
<script>
'use strict';
/* ===== Datos ===== */
const URL_DATOS = 'https://lordkindfyctyy.github.io/panel-de-activos/robots/datos.json';
let D = null;           // {bots:[{id,nombre,valor,capital,...}], series:{id:[valores]}, extra:{...}}
let real = false;

function rnd(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
function demo(){
  const bots=[], series={};
  for(let i=1;i<=14;i++){
    const r=rnd(i*7), cap=1000; let v=cap; const arr=[];
    const drift=(r()-0.42)*0.012;
    for(let k=0;k<40;k++){v*=1+drift+(r()-0.5)*0.02;arr.push(v)}
    bots.push({id:'Bot '+i,nombre:'Robot '+i,valor:v,capital:cap,mercado:i%3?'alcista':'lateral',inicio:'2026-11-11'});
    series['Bot '+i]=arr;
  }
  const vivo={}, ini=new Date('2026-11-11T17:55:00-03:00'), hoy=new Date(), rr=rnd(33);
  let v=1000,b=1000; vivo['Bot 3']=[];
  for(let d=new Date(ini);d<=hoy;d=new Date(d.getTime()+864e5)){v*=1+0.012+(rr()-0.5)*0.01;b*=1-0.006+(rr()-0.5)*0.012;
    vivo['Bot 3'].push({f:d.toISOString().slice(0,10),v,b})}
  const b3=bots.find(x=>x.id==='Bot 3'); b3.valor=vivo['Bot 3'].slice(-1)[0].v; b3.inicio=ini.toISOString();
  const pos=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','LINK','AVAX'].map(m=>({bot:'Bot 3',moneda:m,lado:'en corto',valor_usdt:'100.00'}));
  const ops=[], hoyD=new Date();
  pos.forEach(q=>ops.push({bot:'Bot 3',fecha:ini.toISOString(),moneda:q.moneda,lado:'abre corto',precio:String(100*(1+rr())),usdt:'99.95'}));
  const MON=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','LINK','AVAX'];
  bots.forEach((x,i)=>{
    if(x.id==='Bot 3')return;
    vivo[x.id]=series[x.id].map((val,k)=>({f:new Date(hoyD.getTime()-(39-k)*864e5).toISOString().slice(0,10),v:val,b:1000*(1-0.004*k)}));
    const q=rnd(i*11+5), cant=2+Math.floor(q()*3);
    for(let n=0;n<cant;n++){const m=MON[Math.floor(q()*MON.length)];
      pos.push({bot:x.id,moneda:m,lado:q()>0.5?'comprado':'en corto',valor_usdt:String(180+q()*40)});
      ops.push({bot:x.id,fecha:new Date(hoyD.getTime()-q()*8*864e5).toISOString(),moneda:m,lado:'compra',precio:String(10+q()*500),usdt:'200'})}
  });
  return {bots,series,vivo,pos,ops,extra:demoExtra(bots,pos),actualizado:'(demo)'};
}
function demoExtra(bots,pos){
  const r=rnd(77), hoy=Date.now(), MON=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','LINK','AVAX'];
  const iso=h=>new Date(hoy-h*36e5).toISOString();
  const bit=[];
  for(let k=0;k<14;k++){const bot=['Bot 3','Bot 4','Bot 5'][k%3],res=(r()-0.42)*9;
    bit.push({bot,moneda:MON[Math.floor(r()*10)],lado:r()>0.5?'corto':'largo',entrada:iso(60+k*9),salida:iso(k*7+2),
      invertido:300,resultado_usdt:+(300*res/100).toFixed(2),resultado_pct:+res.toFixed(2),motivo:['24 h','stop','objetivo','noticias en contra'][k%4],motivo_entrada:'noticias (demo)'})}
  const ac=['Bot 3','Bot 4','Bot 5'].map((b,i)=>{const f=bit.filter(x=>x.bot===b),g=f.filter(x=>x.resultado_usdt>0);
    return {bot:b,cerradas:f.length,ganadoras_pct:+(100*g.length/f.length).toFixed(1),ganancia_media_pct:3.1+i,perdida_media_pct:-2.4-i,
      factor:+(1.2+i*0.4).toFixed(2),resultado_usdt:+f.reduce((a,x)=>a+x.resultado_usdt,0).toFixed(2),mejor_pct:7.5,peor_pct:-5.1,evitadas:3+i}});
  const ab=pos.filter(q=>q.bot==='Bot 3'||q.bot==='Bot 5').map(q=>({bot:q.bot,moneda:q.moneda,lado:q.lado==='en corto'?'corto':'largo',desde:iso(40+r()*100),va_pct:+((r()-0.4)*8).toFixed(2),invertido:100}));
  return {memoria:{operaciones:41,
      lecciones:[{cuando:'con el mercado muy agitado (1,3× o más)',n:9,ganadoras_pct:33,media_pct:-1.8},{cuando:'en corto',n:14,ganadoras_pct:64,media_pct:0.9},
                 {cuando:'con noticias muy fuertes (5 o más)',n:11,ganadoras_pct:73,media_pct:2.3},{cuando:'con BTC a favor en 24 h',n:17,ganadoras_pct:71,media_pct:1.6}],
      evitadas:[{fecha:iso(30),moneda:'SOL',lado:'largo',precio:85,habria_pct:-3.2},{fecha:iso(52),moneda:'ETH',lado:'corto',precio:2100,habria_pct:1.4},
                {fecha:iso(70),moneda:'DOGE',lado:'largo',precio:0.07,habria_pct:-4.8},{fecha:iso(5),moneda:'BNB',lado:'corto',precio:690}]},
    agentes:{fuente:'reglas',aviso:'Informes de texto: los agentes no operan, no predicen precios ni dan recomendaciones. (DEMO)',
      noticias:{texto:'Se leyeron 65 notas; 2 de impacto alto. La más fuerte (5 puntos): ejemplo de titular de la demo. El puntaje sale de palabras clave del título: ordena la lectura, no predice precios.',notas:[{titulo:'Titular de ejemplo (demo)',puntos:'5'},{titulo:'Otro titular de ejemplo (demo)',puntos:'4'}]},
      zonas:[{nombre:'Zona 1 · Los fundadores',texto:'Promedio de la zona: +2,9%. Va mejor Bot 3 (+16,4%) y va peor Bot 5 (-1,8%). Esperando en efectivo, sin posiciones: Bot 1, Bot 2, Bot 4.'},
             {nombre:'Zona 2 · Las 10 grandes',texto:'Los 5 robots están en +0,00% desde que arrancaron. Ninguno tiene posiciones abiertas: todos están esperando en efectivo (USDT).'},
             {nombre:'Zona 3 · Bitcoin y ETH/BTC',texto:'Los 5 robots están en +0,00% desde que arrancaron. Ninguno tiene posiciones abiertas: todos están esperando en efectivo (USDT).'}],
      comite:{texto:'2 operaciones cerradas en la bitácora y 11 abiertas ahora. De las últimas 2 cerradas, 0 dieron ganancia.'},alertas:['Bot 5 perdió -6,0% desde que arrancó. (ejemplo de alerta en la demo)']},
    aciertos:ac,bitacora:bit.sort((a,b)=>b.salida.localeCompare(a.salida)),abiertas:ab};
}
function parseVivo(csv){
  const out={}; if(!csv)return out;
  const L=csv.trim().split(/\r?\n/); const h=L.shift().split(',');
  const ib=h.indexOf('bot'), iv=h.indexOf('valor'); if(ib<0||iv<0)return out;
  for(const l of L){const c=l.split(','); const b=c[ib], v=parseFloat(c[iv]); if(b&&isFinite(v))(out[b]=out[b]||[]).push(v)}
  for(const b in out) out[b]=out[b].slice(-40);
  return out;
}
async function descifrar(clave){
  const j = await (await fetch(URL_DATOS,{cache:'no-store'})).json();
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.sal),iterations:j.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plano = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.nonce)},key,b64(j.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}
function parseCsv(csv){
  if(!csv)return[]; const L=csv.trim().split(/\r?\n/); const h=L.shift().split(',');
  return L.map(l=>{const c=l.split(',');const o={};h.forEach((k,i)=>o[k]=c[i]);return o});
}
function vivoCompleto(csv){
  const out={}; for(const r of parseCsv(csv)){const v=parseFloat(r.valor),b=parseFloat(r.btc);
    if(r.bot&&isFinite(v))(out[r.bot]=out[r.bot]||[]).push({f:r.fecha,v,b:isFinite(b)?b:null})}
  return out;
}
function aDatos(x){
  const bots=(x.bots||[]).slice().sort((a,b)=>(parseInt((a.id||'').replace(/\D/g,''))||0)-(parseInt((b.id||'').replace(/\D/g,''))||0));
  return {bots,series:parseVivo(x.vivo),vivo:vivoCompleto(x.vivo),pos:parseCsv(x.posiciones),ops:parseCsv(x.operaciones),extra:x,actualizado:x.actualizado};
}

/* ===== Geometría isométrica ===== */
const TW=72, TH=36, ZH=34;
let OX=0, OY=0, SC=1;
const iso=(x,y,z=0)=>[OX+(x-y)*TW/2, OY+(x+y)*TH/2-z*ZH];
function hsl(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function poly(c,pts,fill,stroke){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function box(c,x,y,w,d,h,z0,col){ // col:[h,s,l]
  const [H,S,L]=col, T=hsl(H,S,L), Lf=hsl(H,S,L*0.78), R=hsl(H,S,L*0.6);
  const z1=z0+h;
  poly(c,[iso(x,y+d,z0),iso(x+w,y+d,z0),iso(x+w,y+d,z1),iso(x,y+d,z1)],Lf);
  poly(c,[iso(x+w,y,z0),iso(x+w,y+d,z0),iso(x+w,y+d,z1),iso(x+w,y,z1)],R);
  poly(c,[iso(x,y,z1),iso(x+w,y,z1),iso(x+w,y+d,z1),iso(x,y+d,z1)],T);
}

/* ===== Plano de la oficina ===== */
const COLS=5, DESKW=1.9, DESKD=1.0, GAPX=2.9, GAPY=3.1;
let L=null; // layout
function armarLayout(){
  const n=D.bots.length, filas=Math.max(1,Math.ceil(n/COLS));
  const ax=1, ay=1, aw=COLS*GAPX+0.6, ah=filas*GAPY+0.6;
  const X=ax+aw+1+5.2;
  L={n,filas,A:{x:ax,y:ay,w:aw,h:ah},
     B:{x:ax+aw+1,y:ay,w:5.2,h:Math.max(3.2,ah/2-0.3)},
     C:{x:ax+aw+1,y:ay+Math.max(3.2,ah/2-0.3)+0.6,w:5.2,h:ah-Math.max(3.2,ah/2-0.3)-0.6},
     E:{x:ax,y:ay+ah+0.6,w:aw,h:3.6},X,Y:ay+ah+0.6+3.6+0.6,desks:[]};
  for(let i=0;i<n;i++){
    const r=Math.floor(i/COLS), c=i%COLS;
    L.desks.push({i,x:ax+0.6+c*GAPX,y:ay+0.5+r*GAPY});
  }
}
const ZONAS=[
 {k:'B',nom:'Noticias y análisis',col:[205,35,30]},
 {k:'C',nom:'Guardián de riesgo',col:[5,40,28]},
 {k:'A',nom:'Sala de robots',col:[150,18,24]},
 {k:'E',nom:'Comité y bitácora',col:[270,28,30]}];

/* ===== Render ===== */
const cv=document.getElementById('lienzo'), ctx=cv.getContext('2d');
let T0=performance.now(), hover=null, sel=null, hits=[];
function ajustar(){
  const w=cv.parentElement.clientWidth-16;
  const bx0=iso(0,L.Y)[0]-OX, bx1=iso(L.X,0)[0]-OX;
  const ancho=(bx1-bx0)+80, alto=(L.X+L.Y)*TH/2+ZH*2.4+60;
  SC=Math.min(1.2,w/ancho,Math.max(0.55,(window.innerHeight-90)/alto));
  const dpr=window.devicePixelRatio||1;
  cv.style.width=w+'px'; cv.style.height=(alto*SC)+'px';
  cv.width=w*dpr; cv.height=alto*SC*dpr;
  ctx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
  OX=-bx0+40; OY=ZH*2.4+10;
  cv._dims={w:w/SC,h:alto};
}
function retorno(b){return (b.valor/b.capital-1)*100}
function dibujar(t){
  ctx.clearRect(0,0,cv._dims.w,cv._dims.h);
  hits=[];
  // suelo por zonas
  const piso=(z,col,extra=0)=>{
    for(let gx=Math.floor(z.x);gx<z.x+z.w;gx++)for(let gy=Math.floor(z.y);gy<z.y+z.h;gy++){
      const w=Math.min(1,z.x+z.w-gx), d=Math.min(1,z.y+z.h-gy), alt=(gx+gy)%2?1.07:1;
      poly(ctx,[iso(gx,gy),iso(gx+w,gy),iso(gx+w,gy+d),iso(gx,gy+d)],hsl(col[0],col[1],col[2]*alt),'rgba(0,0,0,.18)');
    }
  };
  // suelo general oscuro
  for(let gx=0;gx<L.X;gx++)for(let gy=0;gy<L.Y;gy++)poly(ctx,[iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],hsl(210,12,(gx+gy)%2?14:15),'rgba(0,0,0,.15)');
  ZONAS.forEach(z=>piso(L[z.k],z.col));
  // paredes del fondo
  const Hw=2.2;
  poly(ctx,[iso(0,0,0),iso(L.X,0,0),iso(L.X,0,Hw),iso(0,0,Hw)],hsl(215,16,26));
  poly(ctx,[iso(0,0,0),iso(0,L.Y,0),iso(0,L.Y,Hw),iso(0,0,Hw)],hsl(215,16,21));
  // ventanas / pantallas en la pared
  for(let k=0;k<Math.floor(L.X/3);k++){const x=1.2+k*3;const g=0.5+0.5*Math.sin(t/900+k);
    poly(ctx,[iso(x,0,0.9),iso(x+1.8,0,0.9),iso(x+1.8,0,1.9),iso(x,0,1.9)],hsl(200,50,18+g*8),'rgba(255,255,255,.12)');}
  // rótulo de pared izquierda
  ctx.save();const p=iso(0,1.2,1.7);ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='bold 13px system-ui';ctx.fillText('TRADING FLOOR · robots',p[0]+8,p[1]);ctx.restore();

  // entidades ordenadas por profundidad
  const ents=[];
  L.desks.forEach(d=>ents.push({z:d.x+d.y+1,draw:()=>escritorio(d,t)}));
  ents.push({z:L.B.x+L.B.y+2,draw:()=>salaNoticias(t)});
  ents.push({z:L.C.x+L.C.y+2,draw:()=>salaRiesgo(t)});
  ents.push({z:L.E.x+L.E.y+2,draw:()=>salaComite(t)});
  ents.sort((a,b)=>a.z-b.z).forEach(e=>e.draw());
  // rótulos de zonas
  ZONAS.forEach(z=>{const r=L[z.k];const p=iso(r.x+0.2,r.y+r.h-0.15);ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='600 12px system-ui';ctx.fillText(z.nom.toUpperCase(),p[0]+4,p[1]+2)});
}
function persona(x,y,hue,t,fase,estado,etiqueta){
  const b=iso(x,y,0.05), bob=Math.sin(t/380+fase)*1.6*(estado==='dormido'?0.3:1);
  // silla
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(b[0],b[1]+3,13,5,0,0,6.3);ctx.fill();
  // cuerpo
  ctx.fillStyle=hsl(hue,45,48);ctx.beginPath();ctx.roundRect(b[0]-8,b[1]-26+bob,16,24,5);ctx.fill();
  // cabeza
  ctx.fillStyle='#f0cfa8';ctx.beginPath();ctx.arc(b[0],b[1]-33+bob,7.5,0,6.3);ctx.fill();
  ctx.fillStyle=hsl(hue,30,25);ctx.beginPath();ctx.arc(b[0],b[1]-36+bob,7.6,3.3,6.1);ctx.fill();
  // cara
  ctx.fillStyle='#222';ctx.fillRect(b[0]-3.5,b[1]-33+bob,1.8,1.8);ctx.fillRect(b[0]+1.8,b[1]-33+bob,1.8,1.8);
  ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.beginPath();
  if(estado==='feliz')ctx.arc(b[0],b[1]-30.5+bob,3,0.2,2.9);
  else if(estado==='triste')ctx.arc(b[0],b[1]-26.5+bob,3,3.4,6.0);
  else{ctx.moveTo(b[0]-2.5,b[1]-29+bob);ctx.lineTo(b[0]+2.5,b[1]-29+bob)}
  ctx.stroke();
  if(etiqueta){ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillStyle=etiqueta.col;ctx.fillText(etiqueta.txt,b[0],b[1]-46+bob);ctx.textAlign='left'}
}
function escritorio(d,t){
  const b=D.bots[d.i], ret=retorno(b), id=b.id;
  const hue=(d.i*47)%360, esSel=sel&&sel.tipo==='bot'&&sel.i===d.i, esHov=hover&&hover.tipo==='bot'&&hover.i===d.i;
  if(b.id==='Bot 3'){const pu=0.5+0.5*Math.sin(t/400);poly(ctx,[iso(d.x-0.35,d.y-0.35),iso(d.x+DESKW+0.35,d.y-0.35),iso(d.x+DESKW+0.35,d.y+DESKD+1.35),iso(d.x-0.35,d.y+DESKD+1.35)],'rgba(255,214,90,'+(0.12+pu*0.1)+')','rgba(255,214,90,.8)')}
  box(ctx,d.x,d.y,DESKW,DESKD,0.72,0,[30,30,38]);
  // monitor
  box(ctx,d.x+0.45,d.y+0.12,1.0,0.07,0.62,0.72,[210,10,18]);
  // pantalla (cara hacia el frente: plano y = d.y+0.19)
  const ys=d.y+0.19, z0=0.78, z1=1.28, x0=d.x+0.5, x1=d.x+1.4;
  poly(ctx,[iso(x0,ys,z0),iso(x1,ys,z0),iso(x1,ys,z1),iso(x0,ys,z1)],ret>=0?'#10281a':'#2a1512');
  const s=(D.series[id]||[]);
  if(s.length>1){
    const mn=Math.min(...s),mx=Math.max(...s),rg=(mx-mn)||1; ctx.beginPath();
    s.forEach((v,k)=>{const p=iso(x0+0.05+(x1-x0-0.1)*k/(s.length-1),ys,z0+0.05+(z1-z0-0.1)*((v-mn)/rg));k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});
    ctx.strokeStyle=ret>=0?'#7bd88f':'#f0806b';ctx.lineWidth=1.6;ctx.stroke();
  }
  // teclado
  box(ctx,d.x+0.55,d.y+0.55,0.8,0.28,0.04,0.72,[210,8,60]);
  // persona
  const estado=Math.abs(ret)<0.3?'neutro':ret>0?'feliz':'triste';
  persona(d.x+DESKW/2,d.y+DESKD+0.55,hue,t,d.i,estado,{txt:(ret>=0?'+':'')+ret.toFixed(1)+'%',col:ret>=0?'#7bd88f':'#f0806b'});
  // nombre
  const nb=iso(d.x+DESKW/2,d.y+DESKD+0.1,0.0);
  ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(b.id==='Bot 3'?'★ '+id:id,nb[0]+14,nb[1]+22);ctx.textAlign='left';
  // zona clickeable
  const P=[iso(d.x,d.y,1.4),iso(d.x+DESKW,d.y,1.4),iso(d.x+DESKW,d.y+DESKD+1.1,0),iso(d.x,d.y+DESKD+1.1,0),iso(d.x,d.y,0),iso(d.x+DESKW,d.y,0),iso(d.x+DESKW,d.y+DESKD+1.1,1.2),iso(d.x,d.y+DESKD+1.1,1.2)];
  const px_=P.map(q=>q[0]),py_=P.map(q=>q[1]);
  const r={x:Math.min(...px_)-4,y:Math.min(...py_)-18,w:Math.max(...px_)-Math.min(...px_)+8,h:Math.max(...py_)-Math.min(...py_)+30};
  hits.push({tipo:'bot',i:d.i,r});
  if(esSel||esHov){ctx.strokeStyle=esSel?'#ffe27a':'rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h)}
}
function mesa(x,y,w,d,col){box(ctx,x,y,w,d,0.6,0,col)}
function zonaHit(z,tipo,alto=2){

  if((sel&&sel.tipo===tipo)||(hover&&hover.tipo===tipo)){ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle=(sel&&sel.tipo===tipo)?'#ffe27a':'rgba(255,255,255,.4)';ctx.lineWidth=2;poly(ctx,[iso(r.x,r.y),iso(r.x+r.w,r.y),iso(r.x+r.w,r.y+r.h),iso(r.x,r.y+r.h)],null,ctx.strokeStyle);ctx.restore()}
}

function salaRiesgo(t){

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function dentro(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>p.y)!==(b[1]>p.y)&&p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function buscar(e){const p=pos(e);
  const bots=hits.filter(h=>h.tipo==='bot'&&p.x>=h.r.x&&p.x<=h.r.x+h.r.w&&p.y>=h.r.y&&p.y<=h.r.y+h.r.h);
  if(bots.length)return bots[bots.length-1]; // el de más al frente
  return hits.find(h=>h.zona&&dentro(p,h.pts))||null}
cv.addEventListener('mousemove',e=>{hover=buscar(e);cv.style.cursor=hover?'pointer':'default'});
cv.addEventListener('click',e=>{sel=buscar(e);mostrar(sel)});
function extra(obj){try{return '<pre>'+esc(JSON.stringify(obj,null,1).slice(0,2500))+'</pre>'}catch(e){return ''}}
function mostrar(h){
  if(!h){return}
  if(h.tipo==='bot'){ panelBot(h.i); return }
  if(h.tipo==='noticias'){ panel.innerHTML=cardNoticias(); }
  else if(h.tipo==='riesgo'){ panel.innerHTML=cardRiesgo(); }
  else if(h.tipo==='comite'){ panel.innerHTML=cardComite(); }
}

function setModo(r,txt){real=r;$('estado').textContent=txt;$('estado').className=r?'real':'';$('btnReal').style.display=r?'none':'';$('btnDemo').style.display=r?'':'none';$('clave').style.display='none'}
const fmtF=d=>d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
const fmtP=x=>{const n=parseFloat(x);return !isFinite(n)?'-':n>=100?n.toFixed(2):n>=1?n.toFixed(3):n.toPrecision(4)};
const usd=n=>n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=n=>(n>=0?'+':'')+usd(n);
function renderB3(){
  const el=$('b3'), i=D.bots.findIndex(b=>b.id==='Bot 3');
  if(i<0){el.innerHTML='';return}
  const b=D.bots[i], ini=new Date(b.inicio), ahora=new Date();
  const ok=!isNaN(ini), dias=ok?(ahora-ini)/864e5:0;
  const gan=b.valor-b.capital, pct=gan/b.capital*100;
  const v=(D.vivo&&D.vivo['Bot 3'])||[], ult=v.length?v[v.length-1]:null;
  const btcPct=ult&&ult.b!=null?(ult.b/b.capital-1)*100:null;
  const pos=(D.pos||[]).filter(p=>p.bot==='Bot 3');
  const cls=gan>=0?'pos':'neg';
  el.innerHTML=`<h2>⭐ Bot 3 <span>${real?'datos reales':'DEMO'} · ${real?'actualizado '+esc(D.actualizado||''):'datos inventados'}</span></h2>
  <div class="g">
   <div class="c"><div class="k">Empezó el</div><div class="v">${ok?fmtF(ini):'-'}</div></div>
   <div class="c"><div class="k">Días corriendo</div><div class="v">${ok?dias.toFixed(1).replace('.',','):'-'}</div></div>
   <div class="c"><div class="k">Capital inicial</div><div class="v">${usd(b.capital)}</div></div>
   <div class="c"><div class="k">Valor hoy</div><div class="v">${usd(b.valor)}</div></div>
   <div class="c"><div class="k">Ganancia a hoy</div><div class="v ${cls}">${sg(gan)} USDT</div></div>
   <div class="c"><div class="k">Resultado</div><div class="v ${cls}">${sg(pct)}%</div></div>
   ${btcPct!=null?`<div class="c"><div class="k">Bitcoin con lo mismo</div><div class="v ${btcPct>=0?'pos':'neg'}">${sg(btcPct)}%</div></div>`:''}
  </div>
  <canvas id="b3c"></canvas>
  ${pos.length?`<div class="chips">${pos.map(p=>`<span class="chip">${esc(p.moneda)} · ${esc(p.lado)}${p.valor_usdt?' · '+usd(parseFloat(p.valor_usdt)):''}</span>`).join('')}</div>`:''}`;
  graficoB3(b,ini,v);
}
function graficoB3(b,ini,v,cv2,H0,nom){
  const c=cv2||$('b3c'); if(!c)return; const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=H0||130;
  c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  if(v.length<1){g.fillStyle='#8b979f';g.font='13px system-ui';g.fillText('Todavía no hay historial diario',12,H/2);return}
  const t0=isNaN(ini)?new Date(v[0].f+'T00:00:00').getTime():ini.getTime();
  const A=[{t:t0,v:b.capital,b:b.capital}].concat(v.map(p=>({t:new Date(p.f+'T12:00:00').getTime(),v:p.v,b:p.b})));
  A.push({t:Date.now(),v:b.valor,b:null});
  const vals=A.flatMap(p=>[p.v,p.b]).filter(x=>x!=null), mn=Math.min(...vals,b.capital),mx=Math.max(...vals,b.capital),rg=(mx-mn)||1;
  const t1=A[A.length-1].t, X=t=>40+(W-52)*(t-t0)/((t1-t0)||1), Y=x=>H-22-(H-38)*(x-mn)/rg;
  g.strokeStyle='#2c353d';g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(40,Y(b.capital));g.lineTo(W-12,Y(b.capital));g.stroke();g.setLineDash([]);
  g.fillStyle='#8b979f';g.font='11px system-ui';g.textAlign='right';g.fillText(Math.round(mx),36,Y(mx)+4);g.fillText(Math.round(mn),36,Y(mn)+4);g.textAlign='left';
  const linea=(k,col)=>{g.beginPath();let on=false;A.forEach(p=>{if(p[k]==null)return;const x=X(p.t),y=Y(p[k]);on?g.lineTo(x,y):g.moveTo(x,y);on=true});g.strokeStyle=col;g.lineWidth=2;g.stroke()};
  linea('b','#8b979f');linea('v','#7bd88f');
  g.fillStyle='#8b979f';g.fillText('inicio '+new Date(t0).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}),40,H-6);
  g.textAlign='right';g.fillText('hoy',W-12,H-6);g.textAlign='left';
  g.fillStyle='#7bd88f';g.fillText('● '+(nom||'Bot 3'),W-150,14);g.fillStyle='#8b979f';g.fillText('● Bitcoin',W-80,14);
}
function cargar(d){D=d;armarLayout();ajustar();sel=null;hover=null;renderB3();
  const i=D.bots.findIndex(b=>b.id==='Bot 3'); if(i>=0){sel={tipo:'bot',i};mostrar(sel)}}
$('btnReal').onclick=()=>{$('clave').style.display='flex';$('pw').focus()};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('ok').click()};
$('ok').onclick=async()=>{
  const k=$('pw').value; if(!k)return; $('ok').disabled=true;
  try{const x=await descifrar(k);$('pw').value='';cargar(aDatos(x));setModo(true,'REAL · actualizado '+(x.actualizado||''))}
  catch(e){alert('No pude abrir los datos reales: clave incorrecta o sin conexión.')}
  $('ok').disabled=false;
};
$('btnDemo').onclick=()=>{cargar(demo());setModo(false,'DEMO · datos inventados')};
window.addEventListener('resize',()=>{ajustar();if(D)renderB3()});
cargar(demo());
requestAnimationFrame(frame);
